name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev
        working-directory: backend
      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
        working-directory: backend
      - name: Lint scripts
        run: |
          uv run --project backend ruff check scripts
          uv run --project backend ruff format --check scripts
      - name: Type-check
        run: uv run mypy
        working-directory: backend
      - name: Test
        run: uv run pytest --cov=vulnagent --cov-report=term-missing
        working-directory: backend

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
